version: 2

macros:
  - name: test_assert_vera_lessthan
    description: >
      This SQL-based test validates historical numeric data in a specified model by comparing
      the distinct count of a column over two specified time intervals to ensure the difference
      between them does not exceed certain values. It compares the row counts from the model
      and a comparison table, optionally considering the comparison table as a snapshot,
      and removes specified outliers based on the rank of differences.
    arguments:
      - name: model
        type: string
        description: The name of the table or view containing the data to be tested. This is the source model where the distinct column counts will be evaluated over time.
      - name: compare_to_table
        type: string
        description: The name of the comparison table to which the model's data will be compared. This table is used to get the previous row counts for validation.
      - name: date_column
        type: string
        description: The name of the date column in the model and comparison table that will be used to determine the time intervals. This column should contain date values that can be formatted and used for partitioning.
      - name: distinct_column
        type: string
        description: The name of the column whose distinct values will be counted in each time interval. This is the primary column for which the test is measuring changes in the number of distinct values over time.
      - name: first_interval
        type: integer
        description: The number of intervals to look back for the first set of row count comparisons. This defines the first time period for comparison.
      - name: max_interval
        type: integer
        description: The maximum number of intervals to look back for the second set of row count comparisons. This defines the upper limit for the second time period for comparison.
      - name: first_interval_value
        type: integer
        description: The threshold value for the absolute difference in distinct counts between the current and previous rows for the first interval. If the difference exceeds this value, the test will flag the interval as a failure.
      - name: second_interval_value
        type: integer
        description: The threshold value for the absolute difference in distinct counts between the current and previous rows for the second interval. If the difference exceeds this value, the test will flag the interval as a failure.
      - name: time_fraction
        type: string
        description: >
          The granularity of the time intervals for partitioning the data. Accepted values are
          'MONTH', 'WEEK', 'DAY', and 'YEAR'. This determines how the date values in date_column
          are formatted and grouped.
      - name: compare_table_is_snapshot
        type: boolean
        description: Indicates whether the comparison table is a snapshot. If TRUE, only rows where dbt_valid_to is null are considered.
      - name: remove_n_outlier
        type: integer
        description: The number of top-ranked outliers (based on the absolute difference in distinct counts) to remove from the final validation step. This helps to exclude extreme differences that might skew the test results.